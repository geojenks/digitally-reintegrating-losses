job: extension
config:
  name: french_knot_stitch_qwen_lora_v1
  process:
  - type: sd_trainer
    training_folder: output
    device: cuda:0
    network:
      type: lora
      linear: 16
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 250
      max_step_saves_to_keep: 28
      push_to_hub: false
    datasets:
    - folder_path: data/stitches/french_knot   # point at your dataset
      caption_ext: txt
      caption_dropout_rate: 0.05
      shuffle_tokens: false
      cache_latents_to_disk: true
      resolution:
      - 1024
      flip_x: true
      flip_y: false
    train:
      batch_size: 1
      cache_text_embeddings: true
      steps: 7000
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 0.0001
      dtype: bf16
    model:
      name_or_path: Qwen/Qwen-Image
      arch: qwen_image
      quantize: true
      qtype: uint3|ostris/accuracy_recovery_adapters/qwen_image_torchao_uint3.safetensors
      quantize_te: true
      qtype_te: qfloat8
      low_vram: true
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      prompts:
      - embfnchknt
      - embfnchknt, close-up macro photograph, raking light
      - embfnchknt, a single tulip in red and gold silk thread on ivory silk, 17th
        century English embroidery
      - embfnchknt, a leopard in polychrome silks and gold thread, 17th century English
        embroidery, museum photograph
      - embfnchknt, a peacock with iridescent silks on cream linen, raking light,
        made up of embfnchknt
      - embfnchknt, a rampant lion in gold and silver thread on crimson silk velvet
      - embroidery of man with long red hair with embfnchknt texture, playing chess
        at the park, bomb going off in the background with flames in embfnchknt texture
      - embroidery of woman with long brown hair with embfnchknt texture, doing work
        at a desk, a storm is vivible through the window with lightning bolts embfnchknt
        texture
      - embroidery of a woman holding a coffee cup, in a beanie with embfnchknt texture,
        sitting at a cafe
      - embroidery of a bear with embfnchknt texture building a log cabin in the snow
        covered mountains with embfnchknt texture
      - a winter mountain landscape rendered in embfnchknt, white and silver thread
        on indigo silk
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 3
      sample_steps: 25
meta:
  name: french_knot_stitch_qwen_lora_v1
  version: '1.0'
